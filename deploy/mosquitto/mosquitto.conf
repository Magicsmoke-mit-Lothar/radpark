# MQTT-Broker für Server-Betrieb: NUR mit Benutzername + Passwort, Rechte pro Benutzer.
listener 1883
protocol mqtt

# MQTT über WebSocket – für die Laptop-"Klappe" im Browser. Kein eigener Port nach außen:
# erreichbar nur über Caddy unter /mqtt (also verschlüsselt über Cloudflare: wss://API_HOST/mqtt).
# Es gelten dieselben Passwörter und Rechte (ACL) wie oben.
listener 9001
protocol websockets

allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

# Letzte Zustände (retained) überleben einen Neustart des Brokers
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
