# RadPark – komplettes System in Docker (so, wie es auf einem Server läuft).
#
#   cd deploy
#   cp .env.example .env        # Passwörter & Schlüssel eintragen
#   docker compose up -d --build
#
# Erreichbar:   http://localhost:8088        Admin-Dashboard
#               http://localhost:8088/api    Backend (für die App)
#               http://localhost:8025        Mailpit (abgefangene E-Mails, nur Test, nur dieser Rechner)
# Mit Cloudflare-Tunnel (COMPOSE_PROFILES=tunnel + CLOUDFLARE_TUNNEL_TOKEN in .env):
#               https://API_HOST    / https://ADMIN_HOST
#               mqtt://localhost:1884        Broker für Ständer (nur mit Passwort)
name: radpark-stage

services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: radpark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in deploy/.env setzen}
      POSTGRES_DB: radpark
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radpark"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Absichtlich KEIN "ports:" – die Datenbank ist von außen nicht erreichbar

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      MQTT_API_PASSWORD: ${MQTT_API_PASSWORD:?MQTT_API_PASSWORD in deploy/.env setzen}
      MQTT_STATION_PASSWORD: ${MQTT_STATION_PASSWORD:?MQTT_STATION_PASSWORD in deploy/.env setzen}
      MQTT_STATIONS: ${MQTT_STATIONS:-BER-001,BER-002,BER-003}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/entrypoint.sh:/entrypoint.sh:ro
      - mqttdata:/mosquitto/data
    ports:
      - "${MQTT_PORT:-1884}:1883" # für echte Ständer / externen Simulator

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.node
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      DATABASE_URL: postgres://radpark:${POSTGRES_PASSWORD}@postgres:5432/radpark
      MQTT_URL: mqtt://api:${MQTT_API_PASSWORD}@mosquitto:1883
      PORT: "3000"
      LOG_LEVEL: info
      TRUST_PROXY: "true"
      # Hinter Cloudflare-Tunnel: "cf-connecting-ip" (echte Besucher-IP für die IP-Bremse)
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      BUSINESS_TIMEZONE: Europe/Berlin
      # --- Sicherheit: im Server-Betrieb AUS ---
      DEV_ROUTES: "false"
      DEV_LOGIN_CODES: "false"
      # Simulator-Knöpfe in der App (nur sinnvoll, solange der Simulator statt echter Ständer läuft)
      SIMULATOR_CONTROL: ${SIMULATOR_CONTROL:-true}
      # --- E-Mail: im Test fängt Mailpit alles ab; auf dem Server echten SMTP-Anbieter eintragen ---
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      MAIL_FROM: ${MAIL_FROM:-RadPark <noreply@radpark.local>}
      # --- Bezahlung: nur Stripe-TESTMODUS ---
      PAYMENT_PROVIDER: stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY (sk_test_…) in deploy/.env setzen}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      MIN_START_BALANCE_CENTS: "100"
      # Wer wird beim Anlegen der Testdaten (stage:seed) Admin? → DEINE echte Adresse
      SEED_ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # Kein "ports:" – das Backend ist nur über Caddy (/api) erreichbar

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      API_HOST: ${API_HOST:-}
      ADMIN_HOST: ${ADMIN_HOST:-}
    ports:
      # Lokaler Zugang (Heimnetz). Mit Tunnel nicht nötig → HTTP_BIND=127.0.0.1 = nur dieser Rechner
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8088}:80"
      # Für echtes HTTPS auf einem Server zusätzlich: "443:443" (und HTTP_PORT=80)
    volumes:
      - caddydata:/data # HTTPS-Zertifikate

  # Test-Postfach: fängt alle E-Mails ab → http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      # Nur von diesem Rechner aus erreichbar – hier liegen (Test-)Login-Codes!
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  # Simulator statt echter Ständer. Bedienen: docker attach radpark-stage-simulator-1
  # (wieder lösen ohne Beenden: Strg+P, dann Strg+Q)
  simulator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.node
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command: ["sh", "-c", "cd apps/simulator && exec node_modules/.bin/tsx src/index.ts"]
    stdin_open: true
    tty: true
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      SIM_STATION_PASSWORD: ${MQTT_STATION_PASSWORD}
      API_URL: http://api:3000
      SIM_STATE_FILE: /data/sim-state.json
    volumes:
      - simdata:/data

  # Cloudflare-Tunnel: verbindet sich VON INNEN mit Cloudflare – kein offener Port am Router.
  # Wohin welche Adresse geht, stellst du im Cloudflare-Dashboard ein (→ http://web:80).
  # Nur aktiv mit COMPOSE_PROFILES=tunnel in deploy/.env.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # Ohne Token startet cloudflared nicht (nur relevant mit COMPOSE_PROFILES=tunnel)
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web

volumes:
  pgdata:
  mqttdata:
  caddydata:
  simdata:
